<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>لوحة متابعة طلاب نمو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; } [hidden] { display: none !important; }
/* Layout: a calm ledger — sticky header with sync state, tab rail, then summary-before-detail panels on a paper ground. */
:root {
  --bg: #f4f5f0;
  --surface: #fcfcfa;
  --surface-2: #eef0e9;
  --line: #dde1d6;
  --fg: #1b2420;
  --muted: #5a645e;
  --faint: #8a938d;
  --accent: #1f5a66;
  --accent-soft: #e2edee;
  --accent-fg: #ffffff;
  --gold: #8a6a1f;
  --good: #2b7a2e;
  --good-bg: #e5f2e3;
  --warn: #a35a00;
  --warn-bg: #fdf0dc;
  --bad: #b3312f;
  --bad-bg: #fbe6e4;
  --info-bg: #eceff4;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --grid: #e6e8e1;
  --shadow: 0 1px 2px rgba(27, 36, 32, .06), 0 2px 8px rgba(27, 36, 32, .04);
  --f-display: "Reem Kufi", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --f-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, "Geeza Pro", sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111513; --surface: #181d1a; --surface-2: #1f2521; --line: #2c3430; --fg: #e5ebe7; --muted: #a2ada6; --faint: #78827c;
    --accent: #79b9c4; --accent-soft: #1d3135; --accent-fg: #0f1a1c; --gold: #d0ac5a;
    --good: #6cc56f; --good-bg: #183020; --warn: #f0a845; --warn-bg: #33260f; --bad: #f07a76; --bad-bg: #3a1918; --info-bg: #222831;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --grid: #262d29; --shadow: 0 1px 2px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111513; --surface: #181d1a; --surface-2: #1f2521; --line: #2c3430; --fg: #e5ebe7; --muted: #a2ada6; --faint: #78827c;
  --accent: #79b9c4; --accent-soft: #1d3135; --accent-fg: #0f1a1c; --gold: #d0ac5a;
  --good: #6cc56f; --good-bg: #183020; --warn: #f0a845; --warn-bg: #33260f; --bad: #f07a76; --bad-bg: #3a1918; --info-bg: #222831;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --grid: #262d29; --shadow: 0 1px 2px rgba(0,0,0,.4);
  color-scheme: dark;
}
/* A light sheet used for PDF capture regardless of the viewer theme */
.pdf-sheet {
  --bg: #ffffff; --surface: #ffffff; --surface-2: #f2f3ef; --line: #d9ddd2; --fg: #111; --muted: #4c5550; --faint: #7d857f;
  --accent: #1f5a66; --accent-soft: #e2edee; --good: #2b7a2e; --good-bg: #e5f2e3; --warn: #a35a00; --warn-bg: #fdf0dc; --bad: #b3312f; --bad-bg: #fbe6e4;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --grid: #e6e8e1;
  background: #fff; color: #111; color-scheme: light;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.6; direction: rtl; margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
.num, td.n, .kpi .v { font-variant-numeric: tabular-nums; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand .mark { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font-family: var(--f-display); font-size: 19px; flex: none; }
.brand h1 { font-family: var(--f-display); font-weight: 500; font-size: 20px; line-height: 1.2; }
.brand .dates { color: var(--muted); font-size: 12.5px; }
.top .spacer { flex: 1 1 auto; }
.sync { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 12.5px; line-height: 1.7; white-space: nowrap; border: 1px solid transparent; }
.chip.good { background: var(--good-bg); color: var(--good); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.info { background: var(--info-bg); color: var(--muted); }
.chip.acc { background: var(--accent-soft); color: var(--accent); }
.chip .ico { font-size: 11px; }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); padding-inline: 8px; }
.btn.small { padding: 3px 9px; font-size: 13px; }
.btn.danger { color: var(--bad); }
.btn[disabled] { opacity: .55; cursor: default; }

/* tabs */
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding-block: 0; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 10px 14px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; font-size: 14.5px; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
.tabbar { border-top: 1px solid var(--line); }
.tabbar .wrap { padding-block: 0; }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: end; padding-block: 16px 4px; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field label { font-size: 12px; color: var(--muted); letter-spacing: .02em; }
select, input[type=text], input[type=search], input[type=number], input[type=date], input[type=url], textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-height: 36px; max-width: 100%;
}
textarea { min-height: 90px; resize: vertical; width: 100%; line-height: 1.7; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 12px; cursor: pointer; color: var(--muted); font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

main { padding-block: 8px 48px; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 26px 0 10px; }
.section-title h2 { font-family: var(--f-display); font-weight: 500; font-size: 19px; }
.section-title .sub { color: var(--muted); font-size: 13px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.panel h3 { font-size: 15px; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.panel h3 .hint { font-weight: 400; color: var(--muted); font-size: 12.5px; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 900px) { .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 680px) { .g2, .g3 { grid-template-columns: minmax(0, 1fr); } }

/* KPI strip */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.kpi { padding: 14px 16px; border-inline-start: 1px solid var(--line); min-width: 0; }
.kpi:first-child { border-inline-start: 0; }
.kpi .l { font-size: 12.5px; color: var(--muted); }
.kpi .v { font-size: 26px; font-weight: 600; line-height: 1.25; margin-top: 2px; }
.kpi .v small { font-size: 14px; color: var(--muted); font-weight: 400; }
.kpi .s { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
@media (max-width: 1000px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } .kpi:nth-child(4) { border-inline-start: 0; } .kpi:nth-child(n+4) { border-top: 1px solid var(--line); } }
@media (max-width: 560px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpi { border-inline-start: 0 !important; border-top: 1px solid var(--line); } .kpi:nth-child(-n+2) { border-top: 0; } .kpi:nth-child(even) { border-inline-start: 1px solid var(--line) !important; } }

/* lists of students */
.rank { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.rank li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--grid); }
.rank li:first-child { border-top: 0; }
.rank .i { color: var(--faint); font-size: 12.5px; text-align: center; }
.rank .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .nm button { all: unset; cursor: pointer; }
.rank .nm button:hover { color: var(--accent); text-decoration: underline; }
.rank .nm small { color: var(--muted); display: block; font-size: 12px; }
.rank .val { font-weight: 600; }
.empty { color: var(--muted); font-size: 13.5px; padding: 8px 0; }

/* tables */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 9px 12px; text-align: start; border-bottom: 1px solid var(--grid); vertical-align: middle; }
th { font-weight: 600; font-size: 12.5px; color: var(--muted); background: var(--surface-2); white-space: nowrap; position: sticky; top: 0; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--fg); }
th .arr { font-size: 10px; margin-inline-start: 4px; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover { background: var(--surface-2); }
td.n { text-align: center; white-space: nowrap; }
td.name { font-weight: 500; min-width: 170px; }
tr.grouphead td { background: var(--surface-2); font-weight: 600; font-size: 13.5px; }
tr.foot td { font-weight: 600; background: var(--surface-2); }
.cell-bar { display: flex; align-items: center; gap: 8px; justify-content: center; }
.minibar { width: 46px; height: 6px; background: var(--grid); border-radius: 3px; overflow: hidden; flex: none; }
.minibar i { display: block; height: 100%; border-radius: 3px; background: var(--good); }
.minibar i.warn { background: var(--warn); }
.minibar i.bad { background: var(--bad); }
.tot { font-weight: 700; }
.tot.good { color: var(--good); } .tot.warn { color: var(--warn); } .tot.bad { color: var(--bad); }
.delta { font-size: 12.5px; white-space: nowrap; }
.delta.up { color: var(--good); } .delta.down { color: var(--bad); } .delta.flat { color: var(--muted); }

/* student page */
.backline { display: flex; align-items: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.profile { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 14px; margin-top: 12px; }
@media (max-width: 860px) { .profile { grid-template-columns: minmax(0, 1fr); } }
.profile h2 { font-family: var(--f-display); font-weight: 500; font-size: 26px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 13.5px; margin-top: 6px; }
.scorebig { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 14px; }
.scorebig .b { min-width: 0; }
.scorebig .b .l { font-size: 12.5px; color: var(--muted); }
.scorebig .b .v { font-size: 34px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; }
.scorebig .b .v small { font-size: 15px; color: var(--muted); font-weight: 400; }
.crit { display: flex; flex-direction: column; gap: 10px; }
.crit .row { display: grid; grid-template-columns: 150px minmax(0, 1fr) 64px 92px; gap: 10px; align-items: center; }
@media (max-width: 520px) { .crit .row { grid-template-columns: 96px minmax(0, 1fr) 54px; } .crit .row .chip { display: none; } }
.crit .track { height: 10px; background: var(--grid); border-radius: 5px; overflow: hidden; }
.crit .track i { display: block; height: 100%; border-radius: 5px; }
.analysis { border-inline-start: 3px solid var(--gold); background: var(--surface-2); padding: 12px 14px; border-radius: 0 8px 8px 0; }
.analysis p { margin: 0 0 6px; }
.analysis .rec { color: var(--fg); font-weight: 500; }
.analysis .lbl { font-size: 12px; color: var(--gold); font-weight: 600; letter-spacing: .02em; }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 700px) { .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.fact { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.fact .l { font-size: 12px; color: var(--muted); }
.fact .v { font-weight: 600; font-size: 17px; font-variant-numeric: tabular-nums; }
.daytable td { vertical-align: top; }
.ent { font-size: 13px; line-height: 1.55; }
.ent .k { font-weight: 600; }
.ent .rng { color: var(--muted); }
.ent + .ent { margin-top: 6px; }
.flag { color: var(--warn); font-size: 12.5px; }
.ovr { color: var(--gold); font-size: 12.5px; }

.chartbox { position: relative; height: 260px; }
.chartbox.tall { height: 300px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 6px; vertical-align: -1px; }

/* alerts */
.alert-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.alert-list li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); }
.alert-list li .who { font-weight: 600; }
.alert-list li .who button { all: unset; cursor: pointer; }
.alert-list li .who button:hover { text-decoration: underline; }
.alert-list li .txt { color: var(--muted); font-size: 13.5px; }

/* banners & toasts */
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 9px; margin-top: 14px; font-size: 14px; }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.banner.bad { background: var(--bad-bg); color: var(--bad); }
.banner.info { background: var(--info-bg); color: var(--muted); }
.banner b { color: inherit; }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 50; max-width: calc(100% - 32px); box-shadow: var(--shadow); }

/* settings */
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.daypick { display: flex; flex-wrap: wrap; gap: 8px; }
.daypick label { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
.rowedit td { padding: 6px 8px; }
.rowedit input, .rowedit select { width: 100%; min-width: 120px; }
.help { color: var(--muted); font-size: 13px; margin: 4px 0 10px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
details.method { margin-top: 12px; }
details.method summary { cursor: pointer; color: var(--accent); }
details.method ol, details.method ul { padding-inline-start: 20px; margin: 8px 0; }
.wa { white-space: pre-wrap; background: var(--surface-2); border-radius: 8px; padding: 12px; font-size: 13.5px; max-height: 320px; overflow: auto; }
.overlay { position: fixed; inset: 0; background: rgba(10, 14, 12, .45); z-index: 40; display: grid; place-items: center; padding: 16px; }
.dialog { background: var(--surface); border-radius: 12px; border: 1px solid var(--line); width: min(620px, 100%); max-height: 88vh; overflow: auto; padding: 18px; box-shadow: var(--shadow); }
.dialog h3 { font-size: 17px; margin-bottom: 8px; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.loading { padding: 60px 0; text-align: center; color: var(--muted); }
.report-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.report-head h2 { font-family: var(--f-display); font-weight: 500; font-size: 21px; }
@media (prefers-reduced-motion: no-preference) { .tab, .btn, tbody tr { transition: background-color .15s, color .15s; } }

.daytable td:first-child { white-space: nowrap; }


.lockscreen { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: grid; place-items: center; padding: 16px; }
.lockcard { width: min(380px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); }
.lockcard .mark { width: 44px; height: 44px; border-radius: 11px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font-family: var(--f-display); font-size: 24px; }
.lockcard h1 { font-family: var(--f-display); font-weight: 500; font-size: 22px; }
.lockcard p { margin: 0; }
.lockcard input { width: 100%; font-size: 16px; }
.lockcard .btn { justify-content: center; padding: 9px; font-size: 15px; }
#lockMsg { color: var(--bad); min-height: 1.6em; }

</style>
</head>
<body>
<div id="lock" class="lockscreen" hidden>
  <form id="lockForm" class="lockcard" autocomplete="on">
    <div class="mark" aria-hidden="true">ن</div>
    <h1>لوحة متابعة طلاب نمو</h1>
    <p class="muted">البيانات مشفّرة. أدخل كلمة المرور لعرضها.</p>
    <label for="pw" class="small muted">كلمة المرور</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn primary" type="submit">دخول</button>
    <p id="lockMsg" class="small" role="status"></p>
  </form>
</div>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <div class="mark" aria-hidden="true">ن</div>
      <div>
        <h1>لوحة متابعة طلاب نمو</h1>
        <div class="dates" id="dates"></div>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="sync" id="syncbox" aria-live="polite"></div>
  </div>
  <nav class="tabbar" aria-label="أقسام اللوحة">
    <div class="wrap tabs" role="tablist">
      <button class="tab" type="button" role="tab" data-view="overview">لوحة التحكم</button>
      <button class="tab" type="button" role="tab" data-view="students">الطلاب</button>
      <button class="tab" type="button" role="tab" data-view="reports">التقارير</button>
      <button class="tab" type="button" role="tab" data-view="alerts">التنبيهات</button>
      <button class="tab" type="button" role="tab" data-view="settings">الإعدادات</button>
    </div>
  </nav>
</header>
<main class="wrap" id="main"><div class="loading">جارٍ تحميل بيانات الطلاب…</div></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* Standalone (GitHub Pages) shell: decrypt data.enc.json with the password, then serve it to the app as a read-only store. */
(function () {
  'use strict';
  window.NUMOW_STATIC_MODE = true;
  let resolveUnlock;
  window.NUMOW_UNLOCKED = new Promise((r) => { resolveUnlock = r; });
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const toB64 = (buf) => btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
  let pkg = null;

  async function loadPkg() {
    if (pkg) return pkg;
    const r = await fetch('data.enc.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('fetch');
    pkg = await r.json();
    return pkg;
  }
  async function keyFromPassword(pw, p) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(p.salt), iterations: p.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }
  async function decryptWith(key, p) {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(p.iv) }, key, b64(p.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  function install(data) {
    const store = new Map(Object.entries(data.docs || {}));
    const snap = (p) => ({ id: p.split('/').pop(), exists: store.has(p), data: () => store.get(p), metadata: { fromCache: false, hasPendingWrites: false } });
    const coll = (c) => Array.from(store.keys()).filter((k) => k.startsWith(c + '/') && k.split('/').length === c.split('/').length + 1).sort().map(snap);
    const deny = async () => { throw { code: 'invalid_argument', message: 'read-only' }; };
    const docRef = (p) => ({ id: p.split('/').pop(), path: p, get: async () => snap(p), set: deny, update: deny, delete: deny,
      onSnapshot: (n) => { setTimeout(() => n(snap(p)), 0); return () => {}; } });
    const query = (c) => { const q = { limit: () => q, orderBy: () => q, where: () => q,
      get: async () => { const docs = coll(c); return { docs, size: docs.length, empty: !docs.length }; },
      onSnapshot: (n) => { setTimeout(() => { const docs = coll(c); n({ docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: {} }); }, 0); return () => {}; },
      doc: (id) => docRef(c + '/' + id), add: deny }; return q; };
    const ns = { db: { doc: docRef, collection: query }, user: { id: async () => null, isOwner: () => false, canEdit: () => false, can: () => false } };
    window.claude = { use: async (n) => ns[n] || null };
    window.NUMOW_EXPORTED_AT = data.exportedAt;
    resolveUnlock();
  }

  async function tryUnlock(pw) {
    const p = await loadPkg();
    const key = await keyFromPassword(pw, p);
    const data = await decryptWith(key, p);
    try { sessionStorage.setItem('numow-key', JSON.stringify({ salt: p.salt, k: toB64(await crypto.subtle.exportKey('raw', key)) })); } catch (e) { }
    return data;
  }
  async function trySaved() {
    let saved = null;
    try { saved = JSON.parse(sessionStorage.getItem('numow-key') || 'null'); } catch (e) { }
    if (!saved) return null;
    const p = await loadPkg();
    if (saved.salt !== p.salt) return null;
    const key = await crypto.subtle.importKey('raw', b64(saved.k), { name: 'AES-GCM' }, false, ['decrypt']);
    try { return await decryptWith(key, p); } catch (e) { return null; }
  }

  function showLock() {
    const el = document.getElementById('lock');
    el.hidden = false;
    const form = document.getElementById('lockForm'), input = document.getElementById('pw'), msg = document.getElementById('lockMsg'), btn = form.querySelector('button');
    input.focus();
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!input.value) return;
      btn.disabled = true; msg.textContent = 'جارٍ فتح البيانات…';
      try { const data = await tryUnlock(input.value); el.hidden = true; install(data); }
      catch (err) { msg.textContent = err && err.message === 'fetch' ? 'تعذّر تحميل البيانات، تحقق من الاتصال.' : 'كلمة المرور غير صحيحة.'; input.select(); }
      finally { btn.disabled = false; }
    });
  }

  document.addEventListener('DOMContentLoaded', async () => {
    try { const d = await trySaved(); if (d) { install(d); return; } } catch (e) { }
    showLock();
  });
})();

<script>
/* Numow scoring engine — pure functions, no DOM. Shared by the page and the tests. */
(function (root) {
  'use strict';

  const DAY_NAMES = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
  const CRITERIA = ['att', 'hifz', 'rev'];
  const CRIT_LABEL = { att: 'الحضور', hifz: 'الحفظ', rev: 'المراجعة أو التثبيت' };

  const DEFAULT_SETTINGS = {
    semester: { name: 'الفصل الدراسي الأول 1448هـ', start: '2026-08-30', weeks: 19 },
    studyDays: [0, 1, 2, 3],
    points: { att: 5, hifz: 5, rev: 5 },
    attendance: {
      'حاضر': { mode: 'points', points: 5 },
      'متأخر': { mode: 'points', points: 3 },
      'مستأذن': { mode: 'exclude', points: 0 },
      'غائب': { mode: 'points', points: 0 }
    },
    revPolicy: 'avg',          // avg | max | min | review_first | tathbit_first
    missingEntry: 'zero',      // zero | skip   (present, activity required, nothing recited)
    holidays: [],              // extra holiday dates YYYY-MM-DD
    thresholds: { weekLow: 45, critical: 36, absenceRepeat: 2, absenceWindowWeeks: 4, changeNotable: 6, criterionWeak: 14, criterionGood: 16, criterionExcellent: 18 }
  };

  function mergeSettings(s) {
    const d = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
    if (!s) return d;
    for (const k of Object.keys(s)) {
      if (s[k] && typeof s[k] === 'object' && !Array.isArray(s[k]) && d[k] && typeof d[k] === 'object' && !Array.isArray(d[k])) {
        d[k] = Object.assign({}, d[k], s[k]);
      } else if (s[k] !== undefined) d[k] = s[k];
    }
    return d;
  }

  /* ---------- dates ---------- */
  function parseDate(g) { const [y, m, d] = g.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); }
  function fmtDate(dt) { return dt.toISOString().slice(0, 10); }
  function addDays(g, n) { const d = parseDate(g); d.setUTCDate(d.getUTCDate() + n); return fmtDate(d); }
  function weekday(g) { return parseDate(g).getUTCDay(); }
  function weekStartOf(g) { return addDays(g, -weekday(g)); }
  function riyadhToday(now) {
    const d = now ? new Date(now) : new Date();
    return new Date(d.getTime() + 3 * 3600 * 1000).toISOString().slice(0, 10);
  }

  /* ---------- classification ---------- */
  function classifyStatus(s) {
    if (s === null || s === undefined) return 'pending';
    const t = String(s).trim();
    if (!t || t === '-' || t === '(-)') return 'pending';
    if (t.includes('إجازة') || t.includes('اجازة') || t.includes('عطلة')) return 'holiday';
    if (t.includes('عذر') || t.includes('مستأذن') || t.includes('مستاذن') || t.includes('استئذان')) return 'excused';
    if (t.includes('غائب') || t.includes('غياب')) return 'absent';
    if (t.includes('متأخر') || t.includes('متاخر') || t.includes('تأخر')) return 'late';
    if (t.includes('حاضر') || t.includes('حضور')) return 'present';
    return 'other';
  }
  const STATUS_LABEL = { pending: 'لم تُرصد', holiday: 'إجازة', excused: 'غائب بعذر', absent: 'غائب', late: 'متأخر', present: 'حاضر', other: 'حالة أخرى', notStudy: 'ليس يوم حلقة' };

  function entryKind(k) {
    const t = String(k || '');
    if (t.includes('حفظ')) return 'hifz';
    if (t.includes('مراجع')) return 'murajaa';
    if (t.includes('تثبيت')) return 'tathbit';
    return 'other';
  }

  function attPolicyFor(status, rawText, settings) {
    const pol = settings.attendance || {};
    const keyByStatus = { present: 'حاضر', late: 'متأخر', excused: 'مستأذن', absent: 'غائب' };
    if (rawText && pol[rawText]) return pol[rawText];
    if (keyByStatus[status] && pol[keyByStatus[status]]) return pol[keyByStatus[status]];
    return null;
  }

  /* ratio of an activity group: null = not required/not counted, number in [0, inf) */
  function activityRatio(entries, settings, forceZeroMissing) {
    let a = 0, r = 0, any = false, missing = false;
    for (const e of entries) {
      if (e.r === null || e.r === undefined || !(e.r > 0)) continue;
      if (e.a === null || e.a === undefined) {
        if (forceZeroMissing || settings.missingEntry === 'zero') { r += e.r; any = true; missing = true; }
        continue;
      }
      a += e.a; r += e.r; any = true;
    }
    if (!any) return null;
    return { ratio: r > 0 ? a / r : 0, achieved: a, required: r, missing };
  }

  function combineRev(m, t, policy) {
    const avail = [m, t].filter(Boolean);
    if (!avail.length) return null;
    if (avail.length === 1) return { ...avail[0], chosen: m ? 'murajaa' : 'tathbit' };
    const cm = Math.min(1, m.ratio), ct = Math.min(1, t.ratio);
    switch (policy) {
      case 'max': return cm >= ct ? { ...m, chosen: 'murajaa' } : { ...t, chosen: 'tathbit' };
      case 'min': return cm <= ct ? { ...m, chosen: 'murajaa' } : { ...t, chosen: 'tathbit' };
      case 'review_first': return { ...m, chosen: 'murajaa' };
      case 'tathbit_first': return { ...t, chosen: 'tathbit' };
      default: return { ratio: (cm + ct) / 2, chosen: 'avg', missing: m.missing || t.missing, achieved: null, required: null };
    }
  }

  const round2 = (x) => Math.round(x * 100) / 100;

  /* ---------- one day ---------- */
  function scoreDay(day, settings, ctx) {
    ctx = ctx || {};
    const P = settings.points;
    const g = day.g;
    const wd = weekday(g);
    const out = {
      g, h: day.h || null, weekday: wd, dayName: DAY_NAMES[wd], raw: day.s,
      status: classifyStatus(day.s), entries: (day.e || []).map((e) => ({ ...e, kind: entryKind(e.k) })),
      crit: { att: null, hifz: null, rev: null }, earned: 0, max: 0, counted: false, flags: [], override: null
    };
    if ((settings.holidays || []).includes(g)) { out.status = 'holiday'; out.flags.push('إجازة معتمدة من الإعدادات'); }
    else if (!settings.studyDays.includes(wd) && out.status !== 'present' && out.status !== 'late') { out.status = 'notStudy'; }
    out.label = STATUS_LABEL[out.status] || out.raw;

    if (['holiday', 'notStudy', 'pending'].includes(out.status)) return applyOverride(out, ctx.override, settings);

    const pol = attPolicyFor(out.status, day.s && String(day.s).trim(), settings);
    if (out.status === 'other' && !pol) { out.flags.push('حالة حضور غير معروفة: ' + day.s); return applyOverride(out, ctx.override, settings); }
    if (pol && pol.mode === 'exclude') { out.flags.push('مستبعد من الاحتساب حسب سياسة الحضور'); out.excluded = true; return applyOverride(out, ctx.override, settings); }

    const attPts = pol ? Math.min(P.att, Math.max(0, Number(pol.points) || 0)) : 0;
    out.crit.att = { earned: attPts, max: P.att };

    const hifzE = out.entries.filter((e) => e.kind === 'hifz');
    const murE = out.entries.filter((e) => e.kind === 'murajaa');
    const tatE = out.entries.filter((e) => e.kind === 'tathbit');
    const isAbsent = out.status === 'absent' || (out.status === 'excused');

    if (isAbsent && !out.entries.length) {
      out.crit.hifz = { earned: 0, max: P.hifz, ratio: 0, note: 'غائب' };
      out.crit.rev = { earned: 0, max: P.rev, ratio: 0, note: 'غائب' };
    } else {
      const h = activityRatio(hifzE, settings, isAbsent);
      if (h) {
        out.crit.hifz = { earned: round2(Math.min(1, h.ratio) * P.hifz), max: P.hifz, ratio: h.ratio, achieved: h.achieved, required: h.required, missing: h.missing };
        if (h.missing && !isAbsent) out.flags.push('حاضر ولم يُسجَّل له تسميع حفظ');
      }
      const m = activityRatio(murE, settings, isAbsent);
      const t = activityRatio(tatE, settings, isAbsent);
      const rv = combineRev(m, t, settings.revPolicy);
      if (rv) {
        out.crit.rev = { earned: round2(Math.min(1, rv.ratio) * P.rev), max: P.rev, ratio: rv.ratio, chosen: rv.chosen, murajaa: m, tathbit: t, missing: rv.missing };
        if (rv.missing && !isAbsent) out.flags.push('حاضر ولم يُسجَّل له تسميع مراجعة أو تثبيت');
      }
    }
    out.counted = true;
    return applyOverride(out, ctx.override, settings);
  }

  function applyOverride(out, ov, settings) {
    if (ov && ov.values) {
      const P = settings.points;
      for (const c of CRITERIA) {
        const v = ov.values[c];
        if (v === null || v === undefined || v === '') continue;
        if (v === 'na') { out.crit[c] = null; continue; }
        const n = Math.max(0, Math.min(P[c], Number(v)));
        out.crit[c] = Object.assign({}, out.crit[c] || {}, { earned: n, max: P[c], overridden: true });
      }
      out.override = ov;
      if (CRITERIA.some((c) => out.crit[c])) { out.counted = true; out.excluded = false; }
    }
    out.earned = 0; out.max = 0;
    for (const c of CRITERIA) if (out.crit[c]) { out.earned += out.crit[c].earned; out.max += out.crit[c].max; }
    out.earned = round2(out.earned);
    const full = settings.points.att + settings.points.hifz + settings.points.rev;
    out.norm15 = out.max > 0 ? round2(out.earned / out.max * full) : null;
    if (out.earned > full + 1e-9) throw new Error('daily score above maximum for ' + out.g);
    return out;
  }

  /* ---------- one week ---------- */
  function scoreWeek(doc, settings, opts) {
    opts = opts || {};
    const today = opts.today || riyadhToday();
    const overrides = opts.overrides || {};
    const P = settings.points;
    const days = (doc.days || []).map((d) => scoreDay(d, settings, { override: overrides[doc.sid + '_' + d.g] }));
    const agg = {}; for (const c of CRITERIA) agg[c] = { earned: 0, max: 0 };
    let pending = 0, studyDays = 0, absent = 0, late = 0, excused = 0, present = 0, holidays = 0;
    for (const d of days) {
      if (d.status === 'holiday' || d.status === 'notStudy') { holidays++; continue; }
      studyDays++;
      if (d.status === 'pending' && !d.override) { if (d.g <= today) pending++; else pending++; continue; }
      if (d.status === 'absent') absent++;
      if (d.status === 'late') late++;
      if (d.status === 'excused') excused++;
      if (d.status === 'present' || d.status === 'late') present++;
      for (const c of CRITERIA) if (d.crit[c]) { agg[c].earned += d.crit[c].earned; agg[c].max += d.crit[c].max; }
    }
    const per = 20 * (settings.points.att + settings.points.hifz + settings.points.rev) / 15 / 3; // 20 when 5/5/5
    const crit = {};
    let stdSum = 0, stdMax = 0;
    for (const c of CRITERIA) {
      const a = agg[c];
      const critMax = P[c] * 4;   // a regular four-day week
      crit[c] = { earned: round2(a.earned), max: a.max, std: a.max > 0 ? round2(a.earned / a.max * critMax) : null, stdMax: critMax };
      if (crit[c].std !== null) { stdSum += crit[c].std; stdMax += critMax; }
    }
    const fullWeek = (P.att + P.hifz + P.rev) * 4;
    const actualEarned = round2(CRITERIA.reduce((s, c) => s + agg[c].earned, 0));
    const actualMax = CRITERIA.reduce((s, c) => s + agg[c].max, 0);
    const total = stdMax > 0 ? round2(stdSum / stdMax * fullWeek) : null;
    const lastStudy = days.filter((d) => settings.studyDays.includes(d.weekday)).map((d) => d.g).sort().pop() || doc.weekStart;
    const complete = pending === 0 && lastStudy <= today && actualMax > 0;
    if (total !== null && total > fullWeek + 1e-9) throw new Error('weekly score above maximum');
    if (actualEarned > fullWeek + 1e-9) throw new Error('weekly actual above maximum');
    return {
      sid: doc.sid, weekStart: doc.weekStart, days, crit, total, totalMax: fullWeek, actualEarned, actualMax,
      complete, hasData: actualMax > 0, pending, studyDays, holidays, absent, late, excused, present,
      attendanceRate: (present + absent) > 0 ? present / (present + absent) : null,
      issues: doc.issues || [], fetchedAt: doc.fetchedAt || null
    };
  }

  /* ---------- levels & analysis ---------- */
  function levelOf(v, max, th) {
    if (v === null || v === undefined) return { key: 'na', label: 'لا يوجد' };
    const s = v / max * 20;
    if (s >= th.criterionExcellent) return { key: 'excellent', label: 'ممتاز' };
    if (s >= th.criterionGood) return { key: 'vgood', label: 'جيد جدًا' };
    if (s >= th.criterionWeak) return { key: 'good', label: 'جيد' };
    return { key: 'weak', label: 'يحتاج متابعة' };
  }
  function totalLevel(t, th, full) {
    if (t === null) return { key: 'na', label: 'لا توجد بيانات' };
    const s = t / full * 60;
    if (s < th.critical) return { key: 'critical', label: 'متابعة عاجلة' };
    if (s < th.weekLow) return { key: 'weak', label: 'دون الحد' };
    if (s >= 54) return { key: 'excellent', label: 'ممتاز' };
    return { key: 'good', label: 'جيد' };
  }

  /* history: array of scored weeks for one student sorted ascending by weekStart */
  function analyzeStudent(history, settings, focusWeek) {
    const th = settings.thresholds;
    const withData = history.filter((w) => w.hasData);
    const idx = focusWeek ? withData.findIndex((w) => w.weekStart === focusWeek) : withData.length - 1;
    const cur = idx >= 0 ? withData[idx] : null;
    const prev = idx > 0 ? withData[idx - 1] : null;
    const res = { cur, prev, facts: [], alerts: [], weakest: null, strongest: null, delta: null };
    const finals = withData.filter((w) => w.complete);
    res.semesterAvg = finals.length ? round2(finals.reduce((s, w) => s + w.total, 0) / finals.length) : null;
    res.best = finals.length ? finals.reduce((b, w) => (w.total > b.total ? w : b)) : null;
    res.worst = finals.length ? finals.reduce((b, w) => (w.total < b.total ? w : b)) : null;
    res.absences = withData.reduce((s, w) => s + w.absent, 0);
    res.lates = withData.reduce((s, w) => s + w.late, 0);
    res.excused = withData.reduce((s, w) => s + w.excused, 0);
    if (!cur) return res;

    const lost = CRITERIA.filter((c) => cur.crit[c].std !== null).map((c) => ({ c, lost: round2(cur.crit[c].stdMax - cur.crit[c].std), std: cur.crit[c].std, max: cur.crit[c].stdMax }));
    lost.sort((a, b) => b.lost - a.lost);
    if (lost.length && lost[0].lost > 0.5) res.weakest = lost[0];
    const strong = lost.slice().sort((a, b) => a.lost - b.lost)[0];
    if (strong) res.strongest = strong;
    if (prev && cur.total !== null && prev.total !== null) res.delta = round2(cur.total - prev.total);

    // per-criterion change vs previous week
    res.critDelta = {};
    if (prev) for (const c of CRITERIA) if (cur.crit[c].std !== null && prev.crit[c].std !== null) res.critDelta[c] = round2(cur.crit[c].std - prev.crit[c].std);

    // repeated decline: total fell in each of the last two comparisons
    const tail = withData.slice(Math.max(0, idx - 2), idx + 1).filter((w) => w.total !== null);
    res.decliningStreak = tail.length === 3 && tail[2].total < tail[1].total && tail[1].total < tail[0].total;
    // same criterion weak two weeks in a row
    res.repeatWeak = [];
    if (prev) for (const c of CRITERIA) {
      const a = cur.crit[c].std, b = prev.crit[c].std;
      if (a !== null && b !== null && a / cur.crit[c].stdMax * 20 < th.criterionWeak && b / prev.crit[c].stdMax * 20 < th.criterionWeak) res.repeatWeak.push(c);
    }
    // absences in the recent window
    const win = withData.slice(Math.max(0, idx - th.absenceWindowWeeks + 1), idx + 1);
    res.recentAbsences = win.reduce((s, w) => s + w.absent, 0);

    if (cur.total !== null && cur.total < th.critical) res.alerts.push({ level: 'critical', code: 'critical', text: `الدرجة ${fmt(cur.total)}/60 أقل من حد المتابعة العاجلة (${th.critical})` });
    else if (cur.total !== null && cur.total < th.weekLow) res.alerts.push({ level: 'warn', code: 'low', text: `الدرجة ${fmt(cur.total)}/60 أقل من الحد المقبول (${th.weekLow})` });
    if (res.recentAbsences >= th.absenceRepeat) res.alerts.push({ level: res.recentAbsences >= th.absenceRepeat + 1 ? 'critical' : 'warn', code: 'absence', text: `غاب ${res.recentAbsences === 2 ? 'يومين' : res.recentAbsences + ' أيام'} خلال آخر ${win.length} أسابيع مرصودة` });
    if (res.decliningStreak) res.alerts.push({ level: 'warn', code: 'decline', text: 'تراجعت درجته أسبوعين متتاليين' });
    for (const c of res.repeatWeak) res.alerts.push({ level: 'warn', code: 'repeatWeak', text: `${CRIT_LABEL[c]} ضعيف أسبوعين متتاليين` });
    if (res.delta !== null && res.delta <= -th.changeNotable) res.alerts.push({ level: 'warn', code: 'drop', text: `انخفضت درجته ${fmt(-res.delta)} نقطة عن الأسبوع السابق` });
    if (res.delta !== null && res.delta >= th.changeNotable) res.alerts.push({ level: 'good', code: 'improve', text: `تحسّن ${fmt(res.delta)} نقطة عن الأسبوع السابق` });
    res.needsFollowUp = res.alerts.some((a) => a.level === 'critical' || a.level === 'warn');
    res.urgent = res.alerts.some((a) => a.level === 'critical');
    return res;
  }

  function fmt(x) { if (x === null || x === undefined || isNaN(x)) return '—'; const r = Math.round(x * 10) / 10; return (Number.isInteger(r) ? String(r) : r.toFixed(1)); }

  /* Plain-language analysis built only from computed facts. */
  function narrative(name, a, settings) {
    const th = settings.thresholds;
    const w = a.cur;
    if (!w) return { summary: `لا توجد بيانات مرصودة لـ${name} في الفترة المحددة.`, recommendation: '' };
    const parts = [];
    const lv = {}; for (const c of CRITERIA) lv[c] = levelOf(w.crit[c].std, w.crit[c].stdMax, th);
    const good = CRITERIA.filter((c) => w.crit[c].std !== null && ['excellent', 'vgood'].includes(lv[c].key)).map((c) => CRIT_LABEL[c]);
    if (good.length) parts.push(`الطالب منتظم في ${joinAr(good)}`);

      const x = val(a, sortKey), y = val(b, sortKey);
      if (x === null && y === null) return a.s.name.localeCompare(b.s.name, 'ar');
      if (x === null) return 1; if (y === null) return -1;
      return (typeof x === 'string' ? x.localeCompare(y, 'ar') : x - y) * dir;
    });
    const th = (k, l) => `<th class="sortable" data-sort="${k}" scope="col" aria-sort="${sortKey === k ? (dir > 0 ? 'ascending' : 'descending') : 'none'}">${l}${sortKey === k ? `<span class="arr" aria-hidden="true">${dir > 0 ? '▲' : '▼'}</span>` : ''}</th>`;
    const body = (list) => list.map((r) => {
      const w = r.w;
      const d = r.a ? r.a.delta : null;
      return `<tr class="click" data-open-student="${esc(r.s.id)}" tabindex="0">
        <td class="name">${esc(r.s.name)}</td><td>${esc(r.s.halaqa)}</td><td>${esc((r.s.group || '').replace('مجموعة ', ''))}</td>
        <td class="n">${cellBar(w && w.hasData ? w.crit.att.std : null, 20)}</td>
        <td class="n">${cellBar(w && w.hasData ? w.crit.hifz.std : null, 20)}</td>
        <td class="n">${cellBar(w && w.hasData ? w.crit.rev.std : null, 20)}</td>
        <td class="n"><span class="tot ${clsTotal(r.total)}">${r.total === null ? '—' : F(r.total)}</span></td>
        <td class="n">${deltaHtml(d)}</td>
        <td class="n">${weekStateChip(w)}</td></tr>`;
    }).join('');
    const foot = (list, label) => {
      const ws = list.map((r) => r.w).filter((w) => w && w.hasData);
      const g = E.groupStats(ws);
      return `<tr class="foot"><td colspan="3">${esc(label)} (${g.n} من ${list.length})</td><td class="n">${F(g.avgAtt)}</td><td class="n">${F(g.avgHifz)}</td><td class="n">${F(g.avgRev)}</td><td class="n">${F(g.avgTotal)}</td><td></td><td></td></tr>`;
    };
    let tbody = '';
    const r = st.roster || {};
    if (opts.grouped && st.ui.mode !== 'all' && !st.ui.modeVal) {
      const keys = st.ui.mode === 'halaqa' ? r.halaqat : r.groups;
      for (const k of keys || []) {
        const part = rows.filter((x) => (st.ui.mode === 'halaqa' ? x.s.halaqa : x.s.group) === k);
        if (!part.length) continue;
        tbody += `<tr class="grouphead"><td colspan="9">${esc(k)} · ${part.length} طلاب</td></tr>` + body(part) + foot(part, 'متوسط ' + k);
      }
    } else {
      tbody = body(rows) + (rows.length ? foot(rows, 'المتوسط') : '');
    }
    return `<div class="tablewrap"><table>
      <thead><tr>${th('name', 'الطالب')}${th('halaqa', 'الحلقة')}${th('group', 'مجموعة نمو')}${th('att', 'الحضور /20')}${th('hifz', 'الحفظ /20')}${th('rev', 'المراجعة أو التثبيت /20')}${th('total', 'الإجمالي /60')}<th scope="col">عن السابق</th><th scope="col">الحالة</th></tr></thead>
      <tbody>${tbody || '<tr><td colspan="9" class="empty">لا يوجد طلاب مطابقون</td></tr>'}</tbody></table></div>`;
  }
  function bindTable(root) {
    $$('th[data-sort]', root).forEach((h) => h.addEventListener('click', () => {
      const k = h.dataset.sort;
      if (st.ui.sort.key === k) st.ui.sort.dir *= -1; else { st.ui.sort.key = k; st.ui.sort.dir = (k === 'name' || k === 'halaqa' || k === 'group') ? 1 : -1; }

  /* ---------------- charts ---------------- */
  const charts = [];
  function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
  function killCharts() { while (charts.length) { try { charts.pop().destroy(); } catch (e) { } } }
  function makeChart(el, cfg) {
    if (!window.Chart || !el) return null;
    const fg = css('--muted'), grid = css('--grid');
    Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
    Chart.defaults.color = fg;
    cfg.options = cfg.options || {};
    cfg.options.maintainAspectRatio = false;
    cfg.options.animation = matchMedia('(prefers-reduced-motion: reduce)').matches ? false : { duration: 250 };
    cfg.options.plugins = Object.assign({ legend: { display: false }, tooltip: { rtl: true, textDirection: 'rtl', backgroundColor: css('--fg'), titleColor: css('--bg'), bodyColor: css('--bg'), padding: 10, cornerRadius: 8 } }, cfg.options.plugins || {});
    const sc = cfg.options.scales || {};
    for (const k of Object.keys(sc)) { sc[k].grid = Object.assign({ color: grid, drawTicks: false }, sc[k].grid || {}); sc[k].border = { display: false }; sc[k].ticks = Object.assign({ color: fg, padding: 6 }, sc[k].ticks || {}); }
    const c = new Chart(el, cfg); charts.push(c); return c;
  }
  const SER = () => [css('--s1'), css('--s2'), css('--s3')];
  function legendHtml(items) { return `<div class="legend">${items.map((x) => `<span><i style="background:${x.c}"></i>${esc(x.l)}</span>`).join('')}</div>`; }

  /* ---------------- views: overview ---------------- */
  function todayStats(list) {
    const t = today();
    // most recent study day on or before today
    let day = t;
    for (let i = 0; i < 7; i++) { if (st.S.studyDays.includes(E.weekday(day)) && !(st.S.holidays || []).includes(day)) break; day = E.addDays(day, -1); }
    const ws = E.weekStartOf(day);
    const c = { present: 0, absent: 0, late: 0, excused: 0, pending: 0, holiday: 0, total: list.length };
    for (const s of list) {
      const w = wk(s.id, ws);
      const d = w && w.days.find((x) => x.g === day);
      const k = d ? d.status : 'pending';
      if (k === 'present') c.present++; else if (k === 'late') { c.late++; c.present++; } else if (k === 'absent') c.absent++; else if (k === 'excused') c.excused++; else if (k === 'holiday' || k === 'notStudy') c.holiday++; else c.pending++;
    }
    c.day = day; c.isToday = day === t;
    c.rate = (c.present + c.absent) > 0 ? c.present / (c.present + c.absent) : null;
    return c;
  }

        <div class="kpi"><div class="l">نسبة الحضور</div><div class="v">${td.rate === null ? '—' : bd(Math.round(td.rate * 100) + '%')}<small> يومية</small></div><div class="s">الأسبوعية: ${weekAttRate === null ? '—' : bd(Math.round(weekAttRate * 100) + '%')}</div></div>
        <div class="kpi"><div class="l">متوسط الدرجات</div><div class="v">${F(g.avgTotal)}<small> /60</small></div><div class="s">من ${g.n} طالبًا لديهم بيانات</div></div>
        <div class="kpi"><div class="l">النقاط المكتسبة</div><div class="v">${F(g.points)}</div><div class="s">المجموع الفعلي للطلاب</div></div>
        <div class="kpi"><div class="l">يحتاجون متابعة</div><div class="v" style="color:${follow.length ? 'var(--bad)' : 'var(--good)'}">${follow.length}</div><div class="s">${rows.filter((r) => r.a && r.a.urgent).length} منهم عاجل</div></div>
      </div>

      <div class="grid g2" style="margin-top:14px">
        <div class="panel"><h3>أعلى خمسة طلاب أداءً <span class="hint">من 60</span></h3>${rankList(ranked.slice(0, 5), (r) => `<span class="tot ${clsTotal(r.total)}">${F(r.total)}</span>`)}</div>
        <div class="panel"><h3>أقل خمسة طلاب أداءً <span class="hint">من 60</span></h3>${rankList(ranked.slice(-5).reverse(), (r) => `<span class="tot ${clsTotal(r.total)}">${F(r.total)}</span>`)}</div>
        <div class="panel"><h3>تحسّنوا عن أسبوعهم السابق <span class="hint">${improved.length}</span></h3>${rankList(improved.slice(0, 6), (r) => deltaHtml(r.a.delta))}</div>

      </div>

        ${follow.length ? `<ul class="alert-list">${follow.slice(0, 8).map((r) => `<li>${alertChip(r.a.alerts.find((x) => x.level !== 'good'))}<div><div class="who">${studentLink(r.s)}</div><div class="txt">${esc(r.a.alerts.filter((x) => x.level !== 'good').map((x) => x.text).join(' · '))}</div></div><span class="tot ${clsTotal(r.total)}">${F(r.total)}</span></li>`).join('')}</ul>` : '<p class="empty">لا يوجد طلاب تحت حدود التنبيه في هذا الأسبوع.</p>'}
        ${noData.length ? `<p class="help" style="margin-top:10px">لم تُرصد بيانات هذا الأسبوع لـ: ${noData.map((r) => esc(r.s.name)).join('، ')}</p>` : ''}
      </div>

      <div class="grid g2" style="margin-top:14px">
        <div class="panel"><h3>متوسط الأداء حسب الحلقة <span class="hint">من 20 لكل معيار</span></h3><div class="chartbox"><canvas id="chHalaqa" role="img" aria-label="متوسط المعايير حسب الحلقة"></canvas></div>${legendHtml([{ c: SER()[0], l: 'الحضور' }, { c: SER()[1], l: 'الحفظ' }, { c: SER()[2], l: 'المراجعة أو التثبيت' }])}</div>
        <div class="panel"><h3>متوسط الأداء حسب مجموعة نمو <span class="hint">من 20 لكل معيار</span></h3><div class="chartbox"><canvas id="chGroup" role="img" aria-label="متوسط المعايير حسب مجموعة نمو"></canvas></div>${legendHtml([{ c: SER()[0], l: 'الحضور' }, { c: SER()[1], l: 'الحفظ' }, { c: SER()[2], l: 'المراجعة أو التثبيت' }])}</div>
      </div>

      <div class="section-title"><h2>جدول الطلاب</h2><span class="sub">اضغط على أي طالب لفتح ملفه</span></div>
      ${mainTable(rows, { grouped: true })}
      ${methodNote()}`;
    bindFilters(root); bindTable(root);
    entityChart($('#chHalaqa'), (st.roster || {}).halaqat || [], (s) => s.halaqa, ws);
    entityChart($('#chGroup'), ((st.roster || {}).groups || []), (s) => s.group, ws, (x) => x.replace('مجموعة ', ''));
  }
  function entityChart(el, keys, keyFn, ws, short) {
    const all = students();
    const data = keys.map((k) => E.groupStats(all.filter((s) => keyFn(s) === k).map((s) => wk(s.id, ws)).filter((w) => w && w.hasData)));

      type: 'bar',
      data: { labels: keys.map((k) => (short ? short(k) : k)), datasets: [
        { label: 'الحضور', data: data.map((d) => d.avgAtt === null ? null : E.round2(d.avgAtt)), backgroundColor: c[0], borderRadius: 4, maxBarThickness: 22 },
        { label: 'الحفظ', data: data.map((d) => d.avgHifz === null ? null : E.round2(d.avgHifz)), backgroundColor: c[1], borderRadius: 4, maxBarThickness: 22 },
        { label: 'المراجعة أو التثبيت', data: data.map((d) => d.avgRev === null ? null : E.round2(d.avgRev)), backgroundColor: c[2], borderRadius: 4, maxBarThickness: 22 }] },
      options: { scales: { x: { grid: { display: false } }, y: { min: 0, max: 20, ticks: { stepSize: 5 } } }, plugins: { tooltip: { callbacks: { afterTitle: (it) => { const d = data[it[0].dataIndex]; return `${d.n} طالبًا · المتوسط ${F(d.avgTotal)}/60`; } } } }, datasets: { bar: { categoryPercentage: .7, barPercentage: .9 } } }
    });

  function banners() {
    const out = [];
    const si = syncInfo();
    if (si.s.status === 'failed') out.push(`<div class="banner bad" role="alert"><b>تعذّر الاتصال بمنصة خليل في آخر محاولة.</b> تُعرض آخر بيانات صحيحة محفوظة (${si.last ? ago(si.last) : 'لا توجد مزامنة ناجحة بعد'}).</div>`);
    else if (si.s.status === 'partial' && (si.s.errors || []).length) out.push(`<div class="banner warn"><b>مزامنة جزئية:</b> تعذّر تحديث ${esc((si.s.errors || []).map((e) => e.name || e.sid).filter(Boolean).slice(0, 5).join('، '))}. البيانات السابقة لهؤلاء محفوظة كما هي.</div>`);

  function methodNote() {

  function viewStudent(root) {

    const t = today();

    const tday = todayW && todayW.days.find((d) => d.g === t);
    const note = st.notes.get(s.id);
    const lvl = (c) => w && w.hasData ? E.levelOf(w.crit[c].std, 20, th) : { key: 'na', label: 'لا يوجد' };
    const critRow = (c, color) => {

      // memorization / review / tathbit achievement ratios from raw amounts

      return { att: r('att'), hifz: amt('hifz'), mur: amt('murajaa'), tat: amt('tathbit') };
    })();

    const dayRows = w ? w.days.map((d) => {

      const crit = (c) => d.crit[c] ? `${F(d.crit[c].earned)}${d.crit[c].overridden ? '<span class="ovr" title="معدّل يدويًا"> ✎</span>' : ''}` : '<span class="muted">—</span>';
      const revNote = d.crit.rev && d.crit.rev.murajaa && d.crit.rev.tathbit ? `<div class="small muted">${d.crit.rev.chosen === 'avg' ? 'متوسط المراجعة والتثبيت' : d.crit.rev.chosen === 'murajaa' ? 'احتُسبت المراجعة' : 'احتُسب التثبيت'}</div>` : '';
      return `<tr><td><b>${esc(d.dayName)}</b><div class="small muted num">${esc(greg(d.g, true))}<br>${esc(d.h ? d.h : hijri(d.g, true))}</div></td>
        <td><span class="chip ${d.status === 'present' ? 'good' : d.status === 'absent' ? 'bad' : d.status === 'late' || d.status === 'excused' ? 'warn' : 'info'}">${esc(d.label)}</span>${d.flags.map((f) => `<div class="flag">${esc(f)}</div>`).join('')}${d.override ? `<div class="ovr">تعديل يدوي: ${esc(d.override.reason || '')}</div>` : ''}</td>
        <td>${ents}</td>

        <div class="fact"><div class="l">أفضل أسبوع</div><div class="v">${a.best ? F(a.best.total) : '—'}</div><div class="small muted">${a.best ? esc(weekLabel(a.best.weekStart)) : ''}</div></div>

  function overrideDialog(s, g) {
    const key = s.id + '_' + g;
    const cur = st.overrides.get(key);
    const w = wk(s.id, E.weekStartOf(g));
    const d = w && w.days.find((x) => x.g === g);
    const P = st.S.points;
    const val = (c) => cur && cur.values && cur.values[c] !== undefined && cur.values[c] !== null ? cur.values[c] : '';
    dialog(`<h3>تعديل يدوي · ${esc(s.name)} · ${esc(E.DAY_NAMES[E.weekday(g)])} ${esc(greg(g, true))}</h3>
      <p class="help">اترك الحقل فارغًا للإبقاء على الدرجة المحسوبة من منصة خليل (${d ? `الحالية: حضور ${d.crit.att ? F(d.crit.att.earned) : '—'}، حفظ ${d.crit.hifz ? F(d.crit.hifz.earned) : '—'}، مراجعة/تثبيت ${d.crit.rev ? F(d.crit.rev.earned) : '—'}` : ''}). يُسجَّل التعديل مع سببه ووقته في سجل التعديلات.</p>
      <div class="form-grid">
        <div class="field"><label for="o_att">الحضور (0–${P.att})</label><input id="o_att" type="number" min="0" max="${P.att}" step="0.5" value="${val('att')}"></div>
        <div class="field"><label for="o_hifz">الحفظ (0–${P.hifz})</label><input id="o_hifz" type="number" min="0" max="${P.hifz}" step="0.5" value="${val('hifz')}"></div>
        <div class="field"><label for="o_rev">المراجعة أو التثبيت (0–${P.rev})</label><input id="o_rev" type="number" min="0" max="${P.rev}" step="0.5" value="${val('rev')}"></div>
      </div>
      <div class="field" style="margin-top:10px"><label for="o_reason">سبب التعديل (مطلوب)</label><input id="o_reason" type="text" value="${esc(cur ? cur.reason || '' : '')}" placeholder="مثال: سمّع عند المشرف بعد الحلقة"></div>
      <div class="actions"><button class="btn primary" type="button" id="o_save">حفظ التعديل</button>${cur ? '<button class="btn danger" type="button" id="o_del">إلغاء التعديل اليدوي</button>' : ''}<button class="btn" type="button" data-close>إغلاق</button><span id="o_err" class="small" style="color:var(--bad)"></span></div>`,
    (dlg, close) => {
      $('#o_save', dlg).addEventListener('click', async () => {
        const reason = $('#o_reason', dlg).value.trim();
        if (!reason) { $('#o_err', dlg).textContent = 'اكتب سبب التعديل'; return; }
        const values = {};
        for (const c of E.CRITERIA) { const v = $('#o_' + c, dlg).value; if (v !== '') { const n = Number(v); if (isNaN(n) || n < 0 || n > P[c]) { $('#o_err', dlg).textContent = 'قيمة خارج الحدود'; return; } values[c] = n; } }
        if (!Object.keys(values).length) { $('#o_err', dlg).textContent = 'أدخل قيمة واحدة على الأقل'; return; }
        const data = { sid: s.id, g, values, reason, by: st.myId, at: new Date().toISOString() };
        if (await writeDoc('overrides/' + key, data)) { audit('override', `${s.name} · ${g}`, cur ? cur.values : null, values, reason); toast('حُفظ التعديل اليدوي'); close(); }
      });
      const del = $('#o_del', dlg);
      if (del) del.addEventListener('click', async () => {
        try { await st.db.doc('overrides/' + key).delete(); audit('override-remove', `${s.name} · ${g}`, cur.values, null, 'إلغاء التعديل اليدوي'); toast('أُلغي التعديل'); close(); } catch (e) { toast('تعذّر الإلغاء'); }
      });
    });
  }

  async function aiWording(s, a, nar, btn) {
    if (!st.sample || !a.cur) return;
    btn.disabled = true; $('#aiNote').textContent = 'جارٍ الصياغة…';
    const w = a.cur;
    const facts = {
      الطالب: s.name, الأسبوع: weekLabel(w.weekStart), نهائي: w.complete, الإجمالي_من_60: w.total,
      الحضور_من_20: w.crit.att.std, الحفظ_من_20: w.crit.hifz.std, المراجعة_أو_التثبيت_من_20: w.crit.rev.std,
      الغياب: w.absent, التأخر: w.late, الفرق_عن_الأسبوع_السابق: a.delta, أكثر_معيار_فقد_فيه_نقاطًا: a.weakest ? E.CRIT_LABEL[a.weakest.c] + ` (فقد ${F(a.weakest.lost)} من 20)` : 'لا يوجد', تنبيهات: a.alerts.map((x) => x.text)
    };
    try {
      const r = await st.sample(`أنت تساعد مشرف حلقة قرآن. اكتب فقرة عربية قصيرة (3 جمل) تلخّص أداء الطالب ثم توصية عملية واحدة، اعتمادًا على هذه الأرقام فقط. لا تذكر أسبابًا أو أحكامًا غير موجودة في البيانات، ولا تضف أرقامًا جديدة، ولا تفترض ظروف الطالب.\n\n${JSON.stringify(facts, null, 1)}\n\nالملخص الحالي المبني على القواعد: ${nar.summary} ${nar.recommendation}`, { modelTier: 'quick' });
      $('#narr').textContent = r.text.trim();
      $('#aiNote').textContent = 'صياغة آلية من الأرقام أعلاه؛ راجعها قبل المشاركة.';
    } catch (e) { $('#aiNote').textContent = e && e.code === 'not_granted' ? 'لم يُسمح بالصياغة الآلية' : 'تعذّرت الصياغة'; }
    finally { btn.disabled = false; }
  }

  /* ---------------- view: alerts ---------------- */
  function viewAlerts(root) {
    const ws = selWeek();
    const rows = rowsFor(filtered(), ws);
    const cat = (title, list, hint) => `<div class="panel"><h3>${title} <span class="hint">${list.length}</span></h3>${hint ? `<p class="help">${hint}</p>` : ''}${list.length ? `<ul class="alert-list">${list.map((x) => `<li>${alertChip(x.al)}<div><div class="who">${studentLink(x.r.s)}</div><div class="txt">${esc(x.al.text)}</div></div><span class="tot ${clsTotal(x.r.total)}">${F(x.r.total)}</span></li>`).join('')}</ul>` : '<p class="empty">لا يوجد</p>'}</div>`;
    const pick = (codes, level) => rows.flatMap((r) => (r.a ? r.a.alerts : []).filter((al) => codes.includes(al.code) && (!level || al.level === level)).map((al) => ({ r, al })));
    const th = st.S.thresholds;
    root.innerHTML = `${filterBar()}
      <div class="section-title"><h2>التنبيهات · ${esc(weekLabel(ws, true))}</h2><span class="sub">الحدود قابلة للتعديل من الإعدادات</span></div>
      <div class="grid g2">
        ${cat('متابعة عاجلة', rows.filter((r) => r.a && r.a.urgent).map((r) => ({ r, al: r.a.alerts.find((x) => x.level === 'critical') })), `درجة أقل من ${th.critical}/60 أو غياب متكرر يتجاوز الحد.`)}
        ${cat('دون الحد المقبول', pick(['low']), `الدرجة الأسبوعية أقل من ${th.weekLow}/60.`)}
        ${cat('غياب متكرر', pick(['absence']), `${th.absenceRepeat} أيام غياب أو أكثر خلال آخر ${th.absenceWindowWeeks} أسابيع مرصودة.`)}
        ${cat('انخفاض متكرر أو ملحوظ', pick(['decline', 'drop', 'repeatWeak']), `تراجع أسبوعين متتاليين، أو انخفاض ${th.changeNotable} نقاط فأكثر، أو ضعف المعيار نفسه أسبوعين.`)}
        ${cat('تحسّن ملحوظ', pick(['improve']), `ارتفاع ${th.changeNotable} نقاط فأكثر عن الأسبوع السابق للطالب نفسه.`)}
        <div class="panel"><h3>لم تُرصد بياناتهم <span class="hint">${rows.filter((r) => !r.w || !r.w.hasData).length}</span></h3>${rows.filter((r) => !r.w || !r.w.hasData).map((r) => `<div>${studentLink(r.s)}</div>`).join('') || '<p class="empty">لا يوجد</p>'}
          ${rows.filter((r) => r.w && r.w.hasData && !r.w.complete).length ? `<p class="help" style="margin-top:8px">أسبوع غير مكتمل الرصد: ${rows.filter((r) => r.w && r.w.hasData && !r.w.complete).map((r) => esc(r.s.name)).join('، ')}</p>` : ''}</div>
      </div>`;
    bindFilters(root);
  }

  /* ---------------- reports ---------------- */
  function scopeList() {
    const rp = st.ui.report;
    let list = students();
    if (rp.scope === 'halaqa' && rp.scopeVal) list = list.filter((s) => s.halaqa === rp.scopeVal);
    if (rp.scope === 'group' && rp.scopeVal) list = list.filter((s) => s.group === rp.scopeVal);
    return list;
  }
  function scopeName() { const rp = st.ui.report; return rp.scope !== 'all' && rp.scopeVal ? rp.scopeVal : 'جميع طلاب نمو'; }

  function buildReport() {
    const rp = st.ui.report;
    const list = scopeList();
    const S = st.S;
    const out = { title: '', subtitle: scopeName(), sections: [], wa: '' };
    if (rp.type === 'daily') {
      const date = rp.date || todayStats(list).day;
      const ws = E.weekStartOf(date);
      out.title = `التقرير اليومي · ${E.DAY_NAMES[E.weekday(date)]} ${greg(date)} · ${hijri(date)}`;
      const rows = list.map((s) => { const w = wk(s.id, ws); const d = w && w.days.find((x) => x.g === date); return { s, d }; });
      const head = ['الطالب', 'الحلقة', 'المجموعة', 'الحضور', 'درجة الحضور', 'درجة الحفظ', 'درجة المراجعة/التثبيت', 'المجموع /15'];
      const body = rows.map(({ s, d }) => [s.name, s.halaqa, s.group, d ? d.label : 'لم تُرصد', d && d.crit.att ? d.crit.att.earned : '—', d && d.crit.hifz ? d.crit.hifz.earned : (d && d.counted ? 'غير مطلوب' : '—'), d && d.crit.rev ? d.crit.rev.earned : '—', d && d.max ? (d.max === 15 ? d.earned : `${F(d.earned)}/${d.max} (${F(d.norm15)})`) : '—']);
      const pend = rows.filter((r) => !r.d || r.d.status === 'pending');
      const c = { p: rows.filter((r) => r.d && (r.d.status === 'present' || r.d.status === 'late')).length, a: rows.filter((r) => r.d && r.d.status === 'absent').length };
      out.sections.push({ type: 'kv', items: [['حاضر', c.p], ['غائب', c.a], ['لم تُرصد', pend.length], ['متوسط الدرجة', F(E.mean(rows.filter((r) => r.d && r.d.max).map((r) => r.d.norm15))) + '/15']] });
      out.sections.push({ type: 'table', title: 'درجات اليوم', head, body, numCols: [4, 5, 6, 7] });
      if (pend.length) out.sections.push({ type: 'text', title: 'لم تُرصد بياناتهم', text: pend.map((r) => r.s.name).join('، ') });
      out.wa = `*${out.title}*\n${scopeName()}\nحاضر: ${c.p} · غائب: ${c.a} · لم تُرصد: ${pend.length}\n\n` + rows.filter((r) => r.d && r.d.max).sort((x, y) => y.d.norm15 - x.d.norm15).map((r, i) => `${i + 1}. ${r.s.name}: ${F(r.d.norm15)}/15 (${r.d.label})`).join('\n') + (pend.length ? `\n\nلم تُرصد: ${pend.map((r) => r.s.name).join('، ')}` : '');
    } else if (rp.type === 'weekly') {
      const ws = rp.week || selWeek();
      out.title = `التقرير الأسبوعي · ${weekLabel(ws, true)}`;
      const rows = rowsFor(list, ws).sort((a, b) => (b.total === null ? -1 : b.total) - (a.total === null ? -1 : a.total));
      const wd = rows.filter((r) => r.w && r.w.hasData);
      const g = E.groupStats(wd.map((r) => r.w));

  async function saveFile(filename, data) {

      } catch (e) { toast('تعذّر التنزيل'); }
      return;
    }
    try { await st.dl.save({ filename, data }); toast('جاهز: ' + filename); }

  function xlsxFrom(models) {
    if (!window.XLSX) throw new Error('مكتبة Excel لم تُحمّل');
    const wb = XLSX.utils.book_new();
    wb.Workbook = { Views: [{ RTL: true }] };
    const used = new Set();
    models.forEach((m, mi) => {
      const aoa = [[m.title], [m.subtitle], []];
      m.sections.forEach((sec) => {
        if (sec.type === 'kv') { sec.items.forEach(([l, v]) => aoa.push([l, v])); aoa.push([]); }
        else if (sec.type === 'text') { aoa.push([sec.title]); aoa.push([sec.text]); aoa.push([]); }
        else { aoa.push([sec.title]); aoa.push(sec.head); sec.body.forEach((r) => aoa.push(r.map((c) => (typeof c === 'number' ? E.round2(c) : c)))); aoa.push([]); }
      });
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      ws['!cols'] = Array.from({ length: 12 }, (_, i) => ({ wch: i === 0 || i === 1 ? 26 : 14 }));
      let name = (m.sheet || m.title).replace(/[\\/?*[\]:]/g, ' ').slice(0, 28) || 'تقرير';
      while (used.has(name)) name = name.slice(0, 25) + ' ' + (mi + 1);
      used.add(name);
      XLSX.utils.book_append_sheet(wb, ws, name);
    });
    return new Uint8Array(XLSX.write(wb, { bookType: 'xlsx', type: 'array' }));

  async function pdfFrom(htmlBlocks) {
    if (!window.html2canvas || !window.jspdf) throw new Error('مكتبة PDF لم تُحمّل');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: 'pt', format: 'a4', orientation: 'portrait' });
    const pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight(), m = 24;
    const host = document.createElement('div');
    host.className = 'pdf-sheet';
    host.style.cssText = 'position:fixed;left:-10000px;top:0;width:900px;padding:28px;direction:rtl;font-family:var(--f-body)';
    document.body.appendChild(host);
    try {
      for (let i = 0; i < htmlBlocks.length; i++) {
        host.innerHTML = htmlBlocks[i];
        await new Promise((r) => setTimeout(r, 30));
        let canvas;
        try { canvas = await html2canvas(host, { scale: 2, backgroundColor: '#ffffff', foreignObjectRendering: true, logging: false }); }
        catch (e) { canvas = null; }
        if (!canvas || canvas.width < 10) canvas = await html2canvas(host, { scale: 2, backgroundColor: '#ffffff', logging: false });
        const imgW = pw - 2 * m, scale = imgW / canvas.width, pageH = (ph - 2 * m) / scale;
        let y = 0, first = true;
        while (y < canvas.height) {
          const h = Math.min(pageH, canvas.height - y);
          const slice = document.createElement('canvas'); slice.width = canvas.width; slice.height = h;
          slice.getContext('2d').drawImage(canvas, 0, y, canvas.width, h, 0, 0, canvas.width, h);
          if (i > 0 || !first) pdf.addPage();
          pdf.addImage(slice.toDataURL('image/jpeg', 0.92), 'JPEG', m, m, imgW, h * scale);
          y += h; first = false;
        }
      }
      return pdf.output('blob');
    } finally { host.remove(); }
  }

    });
    const P = () => ({ att: Number($('#pAtt', root).value), hifz: Number($('#pHifz', root).value), rev: Number($('#pRev', root).value) });
    $('#saveScoring', root).addEventListener('click', () => {
      const points = P();
      if (Object.values(points).some((x) => isNaN(x) || x < 0)) { toast('قيم النقاط غير صحيحة'); return; }
      const studyDays = $$('[data-day]', root).filter((c) => c.checked).map((c) => Number(c.dataset.day));
      if (!studyDays.length) { toast('اختر يومًا واحدًا على الأقل'); return; }
      const attendance = {}; Object.keys(st.S.attendance).forEach((k) => { attendance[k] = { mode: $(`[data-attmode="${CSS.escape(k)}"]`, root).value, points: Math.min(points.att, Number($(`[data-attpts="${CSS.escape(k)}"]`, root).value) || 0) }; });
      const thresholds = {}; Object.keys(st.S.thresholds).forEach((k) => { thresholds[k] = Number($('#th_' + k, root).value); });
      saveSettings({ points, studyDays, attendance, thresholds, revPolicy: $('#revPol', root).value, missingEntry: $('#missPol', root).value }, 'scoring', 'إعدادات الاحتساب');
    });
    $('#addHol', root).addEventListener('click', () => {
      const d = $('#holDate', root).value; if (!d) { toast('اختر التاريخ'); return; }
      const hol = Array.from(new Set((st.S.holidays || []).concat([d]))).sort();
      saveSettings({ holidays: hol }, 'holiday', d, $('#holNote', root).value.trim() || 'عطلة رسمية');
    });
    $$('[data-delhol]', root).forEach((b) => b.addEventListener('click', () => saveSettings({ holidays: (st.S.holidays || []).filter((h) => h !== b.dataset.delhol) }, 'holiday', b.dataset.delhol, 'حذف عطلة')));
    $('#saveCron', root).addEventListener('click', async (e) => {
      const cron = $('#cronSel', root).value;
      const tid = st.S.sync && st.S.sync.triggerId;
      if (!st.mcp || !tid) { toast('تعديل الجدول غير متاح في هذا العرض'); return; }
      e.currentTarget.disabled = true;
      try {
        await st.mcp.callTool(REMOTE, 'update_trigger', { trigger_id: tid, cron_expression: cron }, { cache: false });
        await saveSettings({ sync: Object.assign({}, st.S.sync, { cron }) }, 'sync', 'فترة التحديث');
      } catch (err) { toast('تعذّر تعديل جدول المزامنة: ' + ((err && err.message) || '')); }
      finally { e.currentTarget.disabled = false; }
    });
    $('#saveSem', root).addEventListener('click', () => {
      const semester = { name: $('#semName', root).value.trim(), start: $('#semStart', root).value, weeks: Number($('#semWeeks', root).value) || 19 };
      if (!semester.name || !semester.start) { toast('أدخل اسم الفصل وتاريخ بدايته'); return; }
      saveSettings({ semester }, 'semester', semester.name);
    });
    $('#archiveSem', root).addEventListener('click', () => {
      dialog(`<h3>أرشفة الفصل الحالي</h3><p class="help">يُنقل «${esc(st.S.semester.name)}» إلى الأرشيف بتاريخ انتهاء اليوم، وتبقى جميع بياناته محفوظة. أدخل بيانات الفصل الجديد:</p>
        <div class="form-grid"><div class="field"><label for="nsName">اسم الفصل الجديد</label><input id="nsName" type="text"></div><div class="field"><label for="nsStart">تاريخ بدايته</label><input id="nsStart" type="date"></div></div>
        <div class="actions"><button class="btn primary" type="button" id="nsGo">أرشفة وبدء الفصل الجديد</button><button class="btn" type="button" data-close>إلغاء</button></div>`, (dlg, close) => {
        $('#nsGo', dlg).addEventListener('click', async () => {
          const name = $('#nsName', dlg).value.trim(), start = $('#nsStart', dlg).value;
          if (!name || !start) { toast('أدخل الاسم والتاريخ'); return; }
          const archive = (st.S.archive || []).concat([{ name: st.S.semester.name, start: st.S.semester.start, end: E.addDays(start, -1) }]);
          if (await saveSettings({ archive, semester: { name, start, weeks: st.S.semester.weeks } }, 'semester', 'أرشفة ' + st.S.semester.name)) close();
        });
      });
    });
  }
  function summarizeRoster(r) { return { عدد_الطلاب: r.students.length, الحلقات: r.halaqat, المجموعات: r.groups, الطلاب: r.students.map((s) => `${s.name} | ${s.halaqa} | ${s.group} | ${s.id}${s.active === false ? ' | غير نشط' : ''}`) }; }
  async function pushSyncPrompt(roster) {
    const tid = st.S.sync && st.S.sync.triggerId;
    if (!st.mcp || !tid) { toast('حُفظت الروابط، لكن تعذّر تحديث مهمة المزامنة من هذا العرض', 6000); return; }
    const urls = roster.students.filter((s) => s.active !== false).map((s) => s.url).join('\n');
    try {
      await st.mcp.callTool(REMOTE, 'update_trigger', { trigger_id: tid, prompt: SYNC_TEMPLATE.replace('{{URLS}}', urls) }, { cache: false });
      toast('حُدّثت مهمة المزامنة بالروابط الجديدة، وستُحمَّل سجلات الطلاب الجدد في المزامنة القادمة', 6000);
    } catch (e) { toast('حُفظت الروابط، لكن تعذّر تحديث مهمة المزامنة: ' + ((e && e.message) || ''), 7000); }
  }

  /* ---------------- render ---------------- */
  const VIEWS = { overview: viewOverview, students: viewStudents, student: viewStudent, alerts: viewAlerts, reports: viewReports, settings: viewSettings };
  let rafPending = false;
  function scheduleRender() { if (rafPending) return; rafPending = true; requestAnimationFrame(() => { rafPending = false; rebuild(); render(); }); }
  function render() {
    const main = $('#main');
    renderHeader();
    if (st.static) { const stt = $('.tab[data-view="settings"]'); if (stt) stt.hidden = true; if (st.ui.view === 'settings') st.ui.view = 'overview'; }
    $$('.tab').forEach((t) => t.setAttribute('aria-selected', String(t.dataset.view === st.ui.view || (st.ui.view === 'student' && t.dataset.view === 'students'))));
    killCharts();
    if (st.dbState === 'none') { main.innerHTML = `<div class="loading"><p><b>لا يمكن الوصول إلى بيانات الطلاب من هذا العرض.</b></p><p>بيانات اللوحة خاصة بالمشرف؛ افتحها من حسابك في Claude.</p></div>`; return; }
    if (!st.loaded.roster || !st.loaded.weeks || !st.loaded.settings) { main.innerHTML = '<div class="loading">جارٍ تحميل بيانات الطلاب…</div>'; return; }
    if (!cache) rebuild();
    const scrollY = window.scrollY;
    (VIEWS[st.ui.view] || viewOverview)(main);
    if (st.keepScroll) window.scrollTo(0, scrollY);
    st.keepScroll = true;
  }
  function go(view) { if (view !== 'student') st.ui.prevView = view; st.ui.view = view; st.keepScroll = false; window.scrollTo(0, 0); render(); }

  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-open-student]');
    if (t) { st.ui.prevView = st.ui.view === 'student' ? st.ui.prevView : st.ui.view; st.ui.student = t.dataset.openStudent; st.ui.view = 'student'; st.keepScroll = false; window.scrollTo(0, 0); render(); return; }
    const g = e.target.closest('[data-goto]'); if (g) { go(g.dataset.goto); return; }
    const tab = e.target.closest('.tab'); if (tab) { go(tab.dataset.view); }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Enter') { const t = e.target.closest && e.target.closest('tr[data-open-student]'); if (t) t.click(); } });

  /* ---------------- boot ---------------- */
  async function boot() {
    const h = (location.hash || '').slice(1);
    if (VIEWS[h] && h !== 'student') { st.ui.view = h; st.ui.prevView = h; }
    try { const saved = JSON.parse(localStorage.getItem('numow-ui') || '{}'); if (saved.mode) st.ui.mode = saved.mode; } catch (e) { }
    render();
    if (st.static) await window.NUMOW_UNLOCKED;
    const cl = window.claude;
    if (!cl || !cl.use) { st.dbState = 'none'; render(); return; }
    const [db, user, mcp, dl, sample] = await Promise.all(['db', 'user', 'mcp', 'downloads', 'sample'].map((n) => cl.use(n).catch(() => null)));
    st.mcp = mcp; st.dl = dl; st.sample = sample; st.user = user;
    if (!db) { st.dbState = 'none'; render(); return; }
    st.db = db; st.dbState = 'ok';
    if (user) {
      try { st.myId = await user.id(); } catch (e) { }
      try { st.canEdit = !!(user.isOwner() || user.canEdit()); } catch (e) { }
    }
    const fail = (what) => (err) => { console.error(what, err); if (err && err.code === 'revoked') { st.dbState = 'none'; render(); } };
    db.doc('config/roster').onSnapshot((s) => { st.roster = s.exists ? s.data() : { students: [], halaqat: [], groups: [] }; st.loaded.roster = true; scheduleRender(); }, fail('roster'));
    db.doc('config/settings').onSnapshot((s) => { st.settingsDoc = s.exists ? s.data() : {}; st.S = E.mergeSettings(st.settingsDoc); st.loaded.settings = true; scheduleRender(); }, fail('settings'));
    db.doc('meta/sync').onSnapshot((s) => {
      const prev = st.sync; st.sync = s.exists ? s.data() : null; st.loaded.sync = true;
      if (st.syncRequestedAt && prev && st.sync && st.sync.lastAttemptAt !== prev.lastAttemptAt) { toast(st.sync.status === 'ok' ? 'اكتملت المزامنة مع منصة خليل' : st.sync.status === 'partial' ? 'اكتملت المزامنة جزئيًا' : 'تعذّرت المزامنة؛ البيانات السابقة محفوظة', 6000); st.syncRequestedAt = null; }
      scheduleRender();
    }, fail('sync'));
    db.collection('weeks').limit(1000).onSnapshot((q) => { st.weeks = new Map(q.docs.map((d) => [d.id, d.data()])); st.loaded.weeks = true; scheduleRender(); }, fail('weeks'));
    db.collection('notes').limit(500).onSnapshot((q) => { st.notes = new Map(q.docs.map((d) => [d.id, d.data()])); scheduleRender(); }, fail('notes'));
    db.collection('overrides').limit(1000).onSnapshot((q) => { st.overrides = new Map(q.docs.map((d) => [d.id, d.data()])); scheduleRender(); }, fail('overrides'));
    db.collection('audit').orderBy('at', 'desc').limit(300).onSnapshot((q) => { st.audit = q.docs.map((d) => d.data()); if (st.ui.view === 'settings') scheduleRender(); }, fail('audit'));
    setInterval(() => { if (document.visibilityState === 'visible') renderHeader(); }, 60000);
  }
  window.addEventListener('beforeunload', () => { try { localStorage.setItem('numow-ui', JSON.stringify({ mode: st.ui.mode })); } catch (e) { } });

  const SYNC_TEMPLATE = window.NUMOW_SYNC_TEMPLATE || '';
  boot();
})();

</script>
</body>
</html>
