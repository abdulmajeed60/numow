name: probe-khlel-format
on:
  push:
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sample pages (encrypted before saving)
        env:
          PW: ${{ secrets.NUMOW_SITE_PASSWORD }}
        run: |
          test -n "$PW" || { echo "secret NUMOW_SITE_PASSWORD missing"; exit 1; }
          mkdir -p samples
          for u in "68407/achievement-record" "68407/achievement-record?week=8" "83694/achievement-record?week=7" "38512/achievement-record?week=7" "37343/achievement-record?week=6"; do
            f=$(echo "$u" | tr '/?=' '___')
            curl -sSL -A "Mozilla/5.0" "https://khlel.com/$u" -o raw.html -w "%{http_code} $u\n"
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:PW -in raw.html -out "samples/$f.enc"
          done
          rm -f raw.html
          git config user.name "numow-bot"; git config user.email "numow-bot@users.noreply.github.com"
          git add samples && git commit -m "samples (encrypted)" && git push
